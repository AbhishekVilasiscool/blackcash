  <!-- Laurel wreath (simplified) -->
  <g fill="#D8D0BC" fill-opacity="0.35">
    <ellipse cx="32" cy="32" rx="2.5" ry="6.5" transform="rotate(120 32 32)" />
    <ellipse cx="68" cy="32" rx="2.5" ry="6.5" transform="rotate(60 68 32)" />
    <ellipse cx="22" cy="50" rx="2.5" ry="6.5" transform="rotate(150 22 50)" />
    <ellipse cx="78" cy="50" rx="2.5" ry="6.5" transform="rotate(30 78 50)" />
    <ellipse cx="32" cy="68" rx="2.5" ry="6.5" transform="rotate(180 32 68)" />
    <ellipse cx="68" cy="68" rx="2.5" ry="6.5" transform="rotate(0 68 68)" />
  </g>

  <!-- Center B -->
  <text x="50" y="57" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#3F0F14">B</text>
  <text x="49" y="56" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#D8D0BC" fill-opacity="0.35">B</text>
</svg>