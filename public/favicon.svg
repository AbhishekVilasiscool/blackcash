<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="30%" r="100%">
      <stop offset="0%" stop-color="#7A1F26" />
      <stop offset="100%" stop-color="#3F0F14" />
    </radialGradient>
    <radialGradient id="highlightGrad" cx="35%" cy="30%" r="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="50%" stop-color="transparent" />
    </radialGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.4)" />
    </filter>
  </defs>

  <!-- Wax blob -->
  <path d="M50 94 Q50 98 54 98 Q58 98 58 94 Q58 90 54 90 Q50 90 50 94 M50 6 Q46 2 42 2 Q38 2 38 6 Q38 10 42 10 Q46 10 50 6 M94 50 Q98 46 98 42 Q98 38 94 38 Q90 38 90 42 Q90 46 94 46 M6 50 Q2 46 2 42 Q2 38 6 38 Q10 38 10 42 Q10 46 6 46 Z" fill="url(#waxGrad)" filter="url(#waxShadow)" />

  <!-- Inner highlight -->
